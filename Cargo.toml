[workspace]
resolver = "3"
members = [
    "crates/pocket-link",
    "crates/hub-store",
    "crates/hub-core",
    "crates/hub-net",
    "crates/hub-applet-store",
    "crates/hub-setup",
    "crates/hub-daemons",
    "crates/hub-api",
    "crates/hubd",
    "crates/hub-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/pocket-nexus/pocket-hub"

[workspace.dependencies]
pocket-link = { path = "crates/pocket-link" }
pocket-hub-store = { path = "crates/hub-store" }
pocket-hub-core = { path = "crates/hub-core" }
pocket-hub-net = { path = "crates/hub-net" }
pocket-hub-applet-store = { path = "crates/hub-applet-store" }
pocket-hub-setup = { path = "crates/hub-setup" }
pocket-hub-daemons = { path = "crates/hub-daemons" }
pocket-hub-api = { path = "crates/hub-api" }
pocket-hubd = { path = "crates/hubd" }

# net.http's own response decoding (gzip, deflate, br), streamed and bounded.
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip", "zlib", "brotli"] }
# The applet store's publisher signatures: base64url keys and signatures, ed25519.
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
ed25519-dalek = "2"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
http-body = "1"
if-addrs = "0.13"
libc = "0.2"
png = "0.17"
# The `.pocket` reader of PocketJS (engine/package), the format's authority.
pocket-package = "0.16.0"
rand = "0.9"
rcgen = "0.14"
# rustls with the platform verifier (the macOS trust store) and the system
# proxy settings; no HTTP/2, no cookies.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
# Only to recognise TLS failures in a fetch's error chain (net.http's `tls`).
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
sha2 = "0.10"
subtle = "2"
system-configuration = "0.7"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = "thin"
