<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" role="img" aria-labelledby="icon-title">
  <title id="icon-title">Pocket Hub</title>

  <!-- A menu bar template image (the image set says so): only its alpha is
       used, the system picks the colour. This is the outline of the pair, for
       when no device is linked; MenuBarIconFill is the filled one.

       The app icon's pocket at 18 pt, without the centre fold: at this size
       the fold turns the flap into a Y and the pocket stops reading as one.
       Edges sit on half points, which are whole pixels at 2x. -->
  <g fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round">
    <path d="M3.5 2.25H14.5A1.25 1.25 0 0 1 15.75 3.5V9.75A6 6 0 0 1 9.75 15.75H8.25A6 6 0 0 1 2.25 9.75V3.5A1.25 1.25 0 0 1 3.5 2.25Z"/>
    <path d="M2.25 5.103L9 9L15.75 5.103"/>
  </g>
  <circle cx="9" cy="9" r="1.75" fill="#000"/>
</svg>
